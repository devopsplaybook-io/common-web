name: PR Check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Stop-gap: repository-local equivalent of
# devopsplaybook-io/common-utils/.github/workflows/reusable-npm-pr.yml@main.
# The shared workflow still runs a blocking full `npm audit --audit-level=high`,
# which fails on dev-only advisories with no safe fix. Restore the shared
# `uses:` call once common-utils gates production dependencies only.
# See CONTRIBUTING.md ("Dependency audit policy").
jobs:
  base-package:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - name: Check whether main has a package manifest
        id: check
        run: |
          git fetch origin main --depth=1
          if git cat-file -e origin/main:package.json 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  bootstrap-checks:
    name: Bootstrap verification (initial package PR)
    needs: base-package
    if: needs.base-package.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Report development advisories (non-blocking)
        continue-on-error: true
        run: npm audit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  version-check:
    needs: base-package
    if: needs.base-package.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch main branch
        # `--force` + FETCH_HEAD: a shallow fetch can refuse to update the
        # remote-tracking ref (shallow update race on busy mains); reading the
        # fetched commit directly is always consistent.
        run: git fetch --no-tags --depth=1 --force origin main

      - name: Verify version is higher than main
        run: |
          PR_VERSION=$(jq -r '.version' package.json)
          MAIN_VERSION=$(git show FETCH_HEAD:package.json | jq -r '.version')

          echo "PR version:   ${PR_VERSION}"
          echo "Main version: ${MAIN_VERSION}"

          if [ -z "$MAIN_VERSION" ] || [ "$MAIN_VERSION" = "null" ]; then
            echo "::error::Could not read the version from the main branch package.json"
            exit 1
          fi

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "::error::PR version (${PR_VERSION}) must be higher than main branch version (${MAIN_VERSION}). Please bump the version in package.json."
            exit 1
          fi

          HIGHER=$(printf '%s\n%s' "$PR_VERSION" "$MAIN_VERSION" | sort -V | tail -n1)
          if [ "$HIGHER" != "$PR_VERSION" ]; then
            echo "::error::PR version (${PR_VERSION}) is lower than main branch version (${MAIN_VERSION}). Please bump the version in package.json."
            exit 1
          fi

          echo "Version check passed: ${PR_VERSION} > ${MAIN_VERSION}"

  test-and-build:
    needs: version-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Report development advisories (non-blocking)
        continue-on-error: true
        run: npm audit

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Zip coverage and upload to Quality Dashboard
        if: ${{ success() }}
        env:
          QUALITY_DASHBOARD_URL: ${{ secrets.QUALITY_DASHBOARD_URL }}
          QUALITY_DASHBOARD_TOKEN: ${{ secrets.QUALITY_DASHBOARD_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          REPORT_KEY=$(echo "$PACKAGE_NAME" | sed 's/[^a-zA-Z0-9._:\-\/]/_/g')
          REPORT_KEY="${REPORT_KEY}_coverage"

          if [ -d coverage ]; then
            if [ -z "$QUALITY_DASHBOARD_URL" ] || [ -z "$QUALITY_DASHBOARD_TOKEN" ]; then
              echo "Quality Dashboard URL or token not set, skipping upload"
              exit 0
            fi
            # Zip coverage contents at root level so the jest processor
            # finds coverage-final.json / clover.xml directly
            (cd coverage && zip -r "${{ runner.temp }}/coverage.zip" .)

            META=$(jq -n \
              --arg key "$REPORT_KEY" \
              --arg pkg "$PACKAGE_NAME" \
              '{
                key: $key,
                displayName: "Coverage: \($pkg)",
                processor: "jest"
              }')

            echo "Uploading coverage: $REPORT_KEY"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$QUALITY_DASHBOARD_URL/api/reports/" \
              -H "x-upload-token: $QUALITY_DASHBOARD_TOKEN" \
              -F "meta=$META" \
              -F "file=@${{ runner.temp }}/coverage.zip" \
              --max-time 30)

            if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
              echo "\u2713 Coverage uploaded ($HTTP_CODE)"
            else
              echo "\u26a0 Upload returned HTTP $HTTP_CODE"
            fi
          else
            echo "No coverage/ directory found, skipping upload"
          fi

      - name: Build package
        run: npm run build

  publish-beta:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Generate beta version
        id: beta-version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMIT_SHA=${GITHUB_SHA:0:7}
          BETA_VERSION="${CURRENT_VERSION}-beta.${PR_NUMBER}.${COMMIT_SHA}"
          echo "version=${BETA_VERSION}" >> $GITHUB_OUTPUT
          echo "Beta version will be: ${BETA_VERSION}"

      - name: Update package.json with beta version
        run: |
          npm version ${{ steps.beta-version.outputs.version }} --no-git-tag-version

      - name: Publish beta package
        run: npm publish --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Comment PR with beta version info
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Beta version published!**
              
              **Package**: \`@devopsplaybook.io/common-web@${{ steps.beta-version.outputs.version }}\`
              
              Install with:
              \`\`\`bash
              npm install @devopsplaybook.io/common-web@${{ steps.beta-version.outputs.version }}
              # or
              npm install @devopsplaybook.io/common-web@beta
              \`\`\`
              
              This beta version will be available for testing until the PR is merged.`
            })
